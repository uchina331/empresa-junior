<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Chamados |Empresa Júnior </title>



<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">



<style>


.acoesChamado{

display:flex;

flex-wrap:wrap;

gap:12px;

margin-top:30px;

}

.btn-whats{

background:#25D366;

color:white;

}

.btn-email{

background:#1976D2;

color:white;

}

.btn-print{

background:#6c757d;

color:white;

}

.btn-delete{

background:#dc3545;

color:white;

}

.acoesChamado button{

flex:1;

min-width:140px;

}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    display:flex;
    background:#eef3f8;
    color:#333;
}

/* =========================
   MENU LATERAL
========================= */

.sidebar{
    width:260px;
    min-height:100vh;
    background:#002b5c;
    color:white;
    display:flex;
    flex-direction:column;
    position:fixed;
    left:0;
    top:0;
}

.logo{
    padding:30px 20px;
    text-align:center;
    border-bottom:1px solid rgba(255,255,255,.15);
}

.logo img{
    width:80px;
    margin-bottom:15px;
}

.logo h2{
    font-size:22px;
}

.sidebar nav{
    display:flex;
    flex-direction:column;
    padding:20px;
    gap:12px;
}

.sidebar button{
    padding:15px;
    border:none;
    border-radius:10px;
    background:transparent;
    color:white;
    text-align:left;
    cursor:pointer;
    font-size:15px;
    transition:.3s;
}

.sidebar button:hover{
    background:#005bbb;
}

.sidebar .ativo{
    background:#FFD54F;
    color:#002b5c;
    font-weight:bold;
}

/* =========================
   CONTEÚDO
========================= */

main{
    margin-left:260px;
    width:calc(100% - 260px);
    padding:35px;
}

.topo{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:35px;
}

.topo h1{
    color:#002b5c;
    font-size:34px;
}

.topo p{
    margin-top:8px;
    color:#666;
}

.usuario{
    background:white;
    padding:12px 18px;
    border-radius:12px;
    box-shadow:0 5px 15px rgba(0,0,0,.08);
}

/* =========================
   CARDS
========================= */

.estatisticas{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:20px;
    margin-bottom:35px;
}

.card{
    background:white;
    padding:25px;
    border-radius:18px;
    text-align:center;
    box-shadow:0 10px 25px rgba(0,0,0,.08);
    transition:.3s;
}

.card:hover{
    transform:translateY(-5px);
}

.card h2{
    color:#005bbb;
    font-size:38px;
    margin-bottom:10px;
}

/* =========================
   FILTROS
========================= */

.filtros{
    display:flex;
    gap:15px;
    margin-bottom:30px;
}

.filtros input,
.filtros select{
    padding:14px;
    border:1px solid #ddd;
    border-radius:10px;
    font-size:15px;
}

.filtros input{
    flex:1;
}

/* =========================
   TABELA
========================= */

.tabela{
    background:white;
    border-radius:18px;
    overflow:hidden;
    box-shadow:0 10px 30px rgba(0,0,0,.08);
}

table{
    width:100%;
    border-collapse:collapse;
}

thead{
    background:#005bbb;
    color:white;
}

th{
    padding:18px;
    text-align:left;
}

td{
    padding:18px;
    border-bottom:1px solid #eee;
}

tbody tr{
    transition:.25s;
}

tbody tr:hover{
    background:#f6fbff;
}

/* =========================
   STATUS
========================= */

.status{
    padding:8px 14px;
    border-radius:30px;
    font-size:13px;
    font-weight:600;
    display:inline-block;
}

.pendente{
    background:#fff3cd;
    color:#856404;
}

.andamento{
    background:#d1ecf1;
    color:#0c5460;
}

.concluido{
    background:#d4edda;
    color:#155724;
}

.cancelado{
    background:#f8d7da;
    color:#721c24;
}

/* =========================
   BOTÕES
========================= */

.btn{
    padding:8px 14px;
    border:none;
    border-radius:8px;
    cursor:pointer;
    font-size:14px;
    transition:.3s;
}

.btn-ver{
    background:#005bbb;
    color:white;
}

.btn-ver:hover{
    background:#003f80;
}

/* =========================
   RESPONSIVO
========================= */

@media(max-width:900px){

.sidebar{
    position:relative;
    width:100%;
    min-height:auto;
}

main{
    margin-left:0;
    width:100%;
}

body{
    flex-direction:column;
}

.topo{
    flex-direction:column;
    align-items:flex-start;
    gap:20px;
}

.filtros{
    flex-direction:column;
}

table{
    display:block;
    overflow-x:auto;
}

}

/*================ MODAL ================*/

.modal{

display:none;

position:fixed;

inset:0;

background:rgba(0,0,0,.65);

backdrop-filter:blur(5px);

justify-content:center;

align-items:center;

z-index:9999;

}

.modal-conteudo{

background:white;

width:95%;

max-width:900px;

max-height:90vh;

overflow:auto;

border-radius:20px;

padding:35px;

position:relative;

animation:aparecer .3s;

}

#fecharModal{

position:absolute;

top:15px;

right:25px;

font-size:35px;

cursor:pointer;

font-weight:bold;

}

#fecharModal:hover{

color:#e53935;

}

.info{

margin-bottom:18px;

padding:15px;

background:#f8fbff;

border-radius:12px;

}

.info strong{

display:block;

color:#002b5c;

margin-bottom:6px;

}

.anexos{

display:grid;

grid-template-columns:repeat(auto-fit,minmax(180px,1fr));

gap:15px;

margin-top:25px;

}

.anexo{

background:white;

border:1px solid #ddd;

padding:15px;

border-radius:12px;

text-align:center;

transition:.3s;

}

.anexo:hover{

transform:translateY(-4px);

box-shadow:0 10px 20px rgba(0,0,0,.10);

}

.anexo img{

width:100%;

height:140px;

object-fit:cover;

border-radius:10px;

margin-bottom:10px;

}

.anexo a{

text-decoration:none;

font-weight:600;

color:#005bbb;

}

.logo{
    display:flex;
    align-items:center;
    gap:10px;
    font-size:30px;
    font-weight:bold;
    color:#FFD54F;
}

.logo-header{
    width:45px;
    height:45px;
    object-fit:contain;
}

</style>

</head>

<body>



</div>

</div>

<!-- MENU LATERAL -->
<aside class="sidebar">

<div class="logo">


<div class="logo">
    <img src="logo.png" alt="Logo Empresa Júnior" class="logo-header">
    <span>Empresa Júnior</span>
</div>


</div>

<nav>

<button class="menu ativo">
    📋 Chamados
</button>




 <button
        id="btnSair"
        onclick="logout()"
        style="
            margin-left:15px;
            padding:10px 20px;
            background:#dc3545;
            color:#000000;
            border:none;
            border-radius:8px;
            cursor:pointer;
            font-weight:bold;
        ">

        🚪 Sair

    </button>


</nav>

</aside>

<!-- CONTEÚDO -->
<div id="painelChamados" style="display:none;">

<main>

<header class="topo">
<div class="logo">
    <img src="logo.png" alt="Logo Empresa Júnior" class="logo-header">
    <span>Empresa Júnior</span>
</div>
<div>

<h1>Painel de Chamados</h1>

<p>Gerencie todas as solicitações de serviços.</p>

</div>



</header>

<section class="estatisticas">

<div class="card">

<h2 id="totalChamados">

0

</h2>

<p>Total</p>

</div>

<div class="card">

<h2 id="pendentes">

0

</h2>

<p>Pendentes</p>

</div>

<div class="card">

<h2 id="andamento">

0

</h2>

<p>Em andamento</p>

</div>

<div class="card">

<h2 id="concluidos">

0

</h2>

<p>Concluídos</p>

</div>

</section>

<section class="filtros">

<input
type="text"
id="pesquisa"
placeholder="Pesquisar empresa, responsável ou protocolo...">

<select id="filtroStatus">

<option value="">

Todos os Status

</option>

<option>

Pendente

</option>

<option>

Em andamento

</option>

<option>

Concluído

</option>

<option>

Cancelado

</option>

</select>

</section>

<section class="tabela">

<table>

<thead>

<tr>

<th>Protocolo</th>

<th>Empresa</th>

<th>Responsável</th>

<th>Serviço</th>

<th>Status</th>

<th>Data</th>

<th>Ações</th>

</tr>

</thead>

<tbody id="listaChamados">

<!-- Firestore -->

</tbody>

</table>

</section>

</main>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
    getFirestore,
    collection,
    query,
    orderBy,
    onSnapshot,
    doc,
    getDoc,
    updateDoc,
    deleteDoc,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

import {
    getAuth,
    signInWithEmailAndPassword,
    signOut,
    onAuthStateChanged,
    setPersistence,
    browserSessionPersistence
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

/*================ FIREBASE ================*/

let chamadoAtual = null;

const firebaseConfig = {

 apiKey:"AIzaSyBs1WWlYtYGC18f6QyNJ2h4L-2d9xaHH3g",

authDomain:"empresa-junior-cetep.firebaseapp.com",

projectId:"empresa-junior-cetep",

storageBucket:"empresa-junior-cetep.firebasestorage.app",

messagingSenderId:"62973063152",

appId:"1:62973063152:web:bcea0e3d97d616fccf7735"

};

const app = initializeApp(firebaseConfig);

const db = getFirestore(app);

const auth = getAuth(app);

await setPersistence(auth, browserSessionPersistence);

window.loginAdmin = async function () {

    const email = document.getElementById("email").value;
    const senha = document.getElementById("senha").value;

    try {

        await signInWithEmailAndPassword(auth, email, senha);

        document.getElementById("loginAdmin").style.display = "none";
        document.getElementById("painelChamados").style.display = "block";

    } catch (e) {

        console.log(e.code);
        console.log(e.message);

        alert(e.code);

    }

};

window.logout = async function(){

    await signOut(auth);

}

onAuthStateChanged(auth, (user) => {

    if (user) {

        document.getElementById("loginAdmin").style.display = "none";
        document.getElementById("painelChamados").style.display = "block";

    } else {

        document.getElementById("loginAdmin").style.display = "flex";
        document.getElementById("painelChamados").style.display = "none";

    }

});


window.logout = async function () {

    try {

        await signOut(auth);

        alert("Logout realizado com sucesso!");

    } catch (e) {

        console.error(e);

    }

};

/*================ ELEMENTOS ================*/

const lista = document.getElementById("listaChamados");

const total = document.getElementById("totalChamados");

const pendentes = document.getElementById("pendentes");

const andamento = document.getElementById("andamento");

const concluidos = document.getElementById("concluidos");

/*================ CARREGAR CHAMADOS ================*/

const consulta = query(

    collection(db,"solicitacoes"),

    orderBy("data","desc")

);

onSnapshot(consulta,(snapshot)=>{

    lista.innerHTML="";

    let totalChamados=0;

    let totalPendentes=0;

    let totalAndamento=0;

    let totalConcluidos=0;

    snapshot.forEach((doc)=>{

        const chamado = doc.data();

        totalChamados++;

        if(chamado.status==="Pendente") totalPendentes++;

        if(chamado.status==="Em andamento") totalAndamento++;

        if(chamado.status==="Concluído") totalConcluidos++;

        let classe="pendente";

        if(chamado.status==="Em andamento"){

            classe="andamento";

        }

        if(chamado.status==="Concluído"){

            classe="concluido";

        }

        if(chamado.status==="Cancelado"){

            classe="cancelado";

        }

        const data = chamado.data?.toDate
        ? chamado.data.toDate().toLocaleDateString("pt-BR")
        : "-";

        lista.innerHTML += `

        <tr>

            <td>${chamado.protocolo}</td>

            <td>${chamado.empresa}</td>

            <td>${chamado.responsavel}</td>

            <td>${chamado.servico}</td>

            <td>

                <span class="status ${classe}">

                    ${chamado.status}

                </span>

            </td>

            <td>${data}</td>

            <td>

                <button

                    class="btn btn-ver"

                    onclick="abrirChamado('${doc.id}')">

                    👁 Ver

                </button>

            </td>

        </tr>

        `;

    });

    total.innerHTML = totalChamados;

    pendentes.innerHTML = totalPendentes;

    andamento.innerHTML = totalAndamento;

    concluidos.innerHTML = totalConcluidos;

});



/*================ ABRIR CHAMADO ================*/



window.abrirChamado = async function(id){

chamadoAtual = id;

const documento = await getDoc(doc(db,"solicitacoes",id));

if(!documento.exists()) return;

const chamado = documento.data();

let anexosHTML="";

if(chamado.anexos){

chamado.anexos.forEach(anexo=>{

if(anexo.tipo.startsWith("image")){

anexosHTML += `

<div class="anexo">

<img src="${anexo.url}">

<a href="${anexo.url}" target="_blank">

Abrir imagem

</a>

</div>

`;

}else{

anexosHTML += `

<div class="anexo">

📄

<br><br>

<strong>${anexo.nome}</strong>

<br><br>

<a href="${anexo.url}" target="_blank">

Baixar arquivo

</a>

</div>

`;

}

});

}

document.getElementById("conteudoChamado").innerHTML = `

<hr style="margin:35px 0;">

<h3>⚙ Gerenciamento</h3>

<div class="info">

<strong>Status</strong>

<select id="novoStatus">

<option ${chamado.status=="Pendente"?"selected":""}>
Pendente
</option>

<option ${chamado.status=="Em andamento"?"selected":""}>
Em andamento
</option>

<option ${chamado.status=="Concluído"?"selected":""}>
Concluído
</option>

<option ${chamado.status=="Cancelado"?"selected":""}>
Cancelado
</option>

</select>

</div>

<div class="info">

<strong>Observações Internas</strong>

<textarea
id="observacoes"
rows="6"
placeholder="Digite observações para a equipe...">${chamado.observacoes || ""}</textarea>

</div>

<button
id="salvarChamado"
class="btn btn-ver"
style="margin-top:20px;">

💾 Salvar Alterações

</button>

<div class="info">

<strong>Protocolo</strong>

${chamado.protocolo}

</div>

<div class="info">

<strong>Empresa</strong>

${chamado.empresa}

</div>

<div class="info">

<strong>Responsável</strong>

${chamado.responsavel}

</div>

<div class="info">

<strong>Email</strong>

${chamado.email}

</div>

<div class="info">

<strong>Telefone</strong>

${chamado.telefone}

</div>

<div class="info">

<strong>Cidade</strong>

${chamado.cidade} - ${chamado.estado}

</div>

<div class="info">

<strong>Serviço</strong>

${chamado.servico}

</div>

<div class="info">

<strong>Prioridade</strong>

${chamado.prioridade}

</div>

<div class="info">

<strong>Orçamento</strong>

R$ ${chamado.orcamento || "Não informado"}

</div>

<div class="info">

<strong>Descrição</strong>

${chamado.descricao}

</div>

<h3 style="margin-top:30px;">

📎 Anexos

</h3>

<div class="anexos">

${anexosHTML || "<p>Nenhum anexo enviado.</p>"}

</div>



`;
document.getElementById("salvarChamado").onclick = salvarChamado;

document.getElementById("modalChamado").style.display="flex";



document.getElementById("btnWhatsapp").onclick = ()=>{

window.open(

`https://wa.me/55${(chamado.telefone||"").replace(/\D/g,"")}`,

"_blank"

);

};

document.getElementById("btnEmail").onclick = ()=>{

window.location.href=

`mailto:${chamado.email}`;

};

document.getElementById("btnImprimir").onclick=()=>{

window.print();

};

document.getElementById("btnExcluir").onclick=()=>{

excluirChamado(id);

};
}

document.getElementById("fecharModal").onclick = ()=>{

document.getElementById("modalChamado").style.display="none";

};

document.getElementById("modalChamado").onclick = (e)=>{

if(e.target.id==="modalChamado"){

document.getElementById("modalChamado").style.display="none";

}

};

async function salvarChamado(){

if(!chamadoAtual) return;

const botao = document.getElementById("salvarChamado");

botao.disabled = true;

botao.innerHTML = "⏳ Salvando...";

try{

await updateDoc(

doc(db,"solicitacoes",chamadoAtual),

{

status:

document.getElementById("novoStatus").value,

observacoes:

document.getElementById("observacoes").value,

ultimaAtualizacao:

serverTimestamp()

}

);

botao.innerHTML="✅ Salvo!";

setTimeout(()=>{

botao.innerHTML="💾 Salvar Alterações";

botao.disabled=false;

},1500);

}
catch(erro){

console.error(erro);

alert("Erro ao salvar.");

botao.disabled=false;

botao.innerHTML="💾 Salvar Alterações";

}

}


async function excluirChamado(id){

const confirmar = confirm(

"Deseja realmente excluir este chamado?"

);

if(!confirmar) return;

try{

await deleteDoc(

doc(db,"solicitacoes",id)

);

document.getElementById("modalChamado").style.display="none";

alert("Chamado excluído.");

}
catch(erro){

console.error(erro);

alert("Erro ao excluir.");

}

}

</script>


<div id="modalChamado" class="modal">

    <div class="modal-conteudo">

        <span id="fecharModal">&times;</span>

        <h2>📋 Detalhes do Chamado</h2>

        <div id="conteudoChamado"></div>

        <div class="acoesChamado">

            <button id="btnWhatsapp" class="btn btn-whats">
                WhatsApp
            </button>

            <button id="btnEmail" class="btn btn-email">
                Email
            </button>

            <button id="btnImprimir" class="btn btn-print">
                Imprimir
            </button>

            <button id="btnExcluir" class="btn btn-delete">
                Excluir
            </button>

        </div>

    </div>

</div>
</body>

</html>
